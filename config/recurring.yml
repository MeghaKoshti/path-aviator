# examples:
#   periodic_cleanup:
#     class: CleanSoftDeletedRecordsJob
#     queue: background
#     args: [ 1000, { batch_size: 500 } ]
#     schedule: every hour
#   periodic_cleanup_with_command:
#     command: "SoftDeletedRecord.due.delete_all"
#     priority: 2
#     schedule: at 5am every day

production:
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12

  # Puts the public demo account back to its seeded state every night (UTC).
  # Does nothing unless SEED_DEMO=1, so private installs never get one.
  reset_demo_account:
    class: ResetDemoAccountJob
    queue: default
    schedule: every day at 3am

  # Pro users' active paths get their links opened again (RecheckLinksJob).
  recheck_links:
    class: RecheckLinksJob
    queue: default
    schedule: every monday at 4am

  # Sunday 6pm in each user's own time zone (the job picks who is due).
  weekly_digest:
    class: WeeklyDigestJob
    queue: default
    schedule: every hour at minute 2

  # Copies the database to BACKUP_DIR every night; does nothing without it.
  database_backup:
    class: DatabaseBackupJob
    queue: default
    schedule: every day at 2:30am

  # Catches subscriptions whose webhook was missed: ends Pro for cancelled
  # subscriptions after their paid period and for unpaid ones after the grace.
  billing_reconcile:
    class: BillingReconcileJob
    queue: default
    schedule: every day at 4:30am
