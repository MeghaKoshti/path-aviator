# Kamal deploy config for Path Aviator: one small VPS runs the web app, the
# Solid Queue jobs and SQLite. Nothing server-specific is committed: the values
# below come from your shell environment (see "Deploy" in README.md), and
# secrets come from .kamal/secrets.
#
#   export KAMAL_SERVER_IP=203.0.113.10        # your VPS
#   export KAMAL_REGISTRY_USERNAME=meghakoshti # Docker Hub (or GHCR) user
#   export APP_HOST=pathaviator.example.com    # DNS A record -> KAMAL_SERVER_IP
#   bin/kamal setup                            # first deploy; later: bin/kamal deploy

# Name of your application. Used to uniquely configure containers.
service: path_aviator

# Name of the container image (pushed to the registry below).
image: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>/path_aviator

# Deploy to this server. One server is enough: jobs run inside Puma (see env).
servers:
  web:
    - <%= ENV.fetch("KAMAL_SERVER_IP") %>

# kamal-proxy terminates HTTPS with a free Let's Encrypt certificate for
# APP_HOST, so the domain's DNS must point at the server before `kamal setup`.
# It only switches traffic to a new container once /up answers 200.
#
# Note: If using Cloudflare, set encryption mode in SSL/TLS setting to "Full" to enable CF-to-app encryption.
proxy:
  ssl: true
  host: <%= ENV.fetch("APP_HOST") %>
  healthcheck:
    path: /up
    interval: 3
    timeout: 5

# Credentials for your image host. Docker Hub by default; set
# KAMAL_REGISTRY_SERVER=ghcr.io to use GitHub's registry instead.
registry:
<% if ENV["KAMAL_REGISTRY_SERVER"].present? %>
  server: <%= ENV["KAMAL_REGISTRY_SERVER"] %>
<% end %>
  username: <%= ENV.fetch("KAMAL_REGISTRY_USERNAME") %>

  # Use an access token rather than your real password.
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    # Optional: without it the app uses the built-in sample generator.
    - GEMINI_API_KEY
    # Optional: needed to send password-reset emails (see SMTP_* below).
    - SMTP_PASSWORD
    # Optional: payments through Dodo (see the DODO_* settings below).
    - DODO_API_KEY
    - DODO_WEBHOOK_SECRET
  clear:
    # Used for mailer links and Rails host checks; must match proxy.host.
    APP_HOST: <%= ENV.fetch("APP_HOST") %>

    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # When you start using multiple servers, you should split out job processing to a dedicated machine.
    SOLID_QUEUE_IN_PUMA: true

    # 1 = create the public demo account and reset it on every boot and nightly.
    # 0 (the default) = no demo account: the seeds skip it in production, even
    # on the first boot when Rails seeds the brand-new database.
    SEED_DEMO: "<%= ENV.fetch("SEED_DEMO", "0") %>"
    DEMO_EMAIL: "<%= ENV.fetch("DEMO_EMAIL", "demo@pathaviator.dev") %>"

    # Outgoing email for password resets. Leave SMTP_ADDRESS empty to skip.
    SMTP_ADDRESS: "<%= ENV["SMTP_ADDRESS"] %>"
    SMTP_PORT: "<%= ENV.fetch("SMTP_PORT", "587") %>"
    SMTP_USERNAME: "<%= ENV["SMTP_USERNAME"] %>"
    MAILER_FROM: "<%= ENV.fetch("MAILER_FROM", "Path Aviator <no-reply@#{ENV.fetch("APP_HOST")}>") %>"

    # Operator name and support/grievance email on the policy pages (placeholders when empty).
    LEGAL_OWNER_NAME: "<%= ENV["LEGAL_OWNER_NAME"] %>"
    SUPPORT_EMAIL: "<%= ENV["SUPPORT_EMAIL"] %>"

    # AI cost guard: at most this many generations per UTC day for the whole
    # app, and a cap on Gemini's (billed) thinking tokens per request.
    AI_DAILY_GENERATION_LIMIT: "<%= ENV.fetch("AI_DAILY_GENERATION_LIMIT", "500") %>"
    GEMINI_THINKING_BUDGET: "<%= ENV.fetch("GEMINI_THINKING_BUDGET", "1024") %>"

    # Payments (Dodo Payments). Without the key and product ids the Upgrade
    # buttons stay hidden.
    BILLING_PROVIDER: "<%= ENV.fetch("BILLING_PROVIDER", "dodo") %>"
    DODO_ENVIRONMENT: "<%= ENV.fetch("DODO_ENVIRONMENT", "test_mode") %>"
    DODO_PRODUCT_PRO_MONTHLY_INR: "<%= ENV["DODO_PRODUCT_PRO_MONTHLY_INR"] %>"
    DODO_PRODUCT_PRO_YEARLY_INR: "<%= ENV["DODO_PRODUCT_PRO_YEARLY_INR"] %>"
    DODO_PRODUCT_PRO_MONTHLY_USD: "<%= ENV["DODO_PRODUCT_PRO_MONTHLY_USD"] %>"
    DODO_PRODUCT_PRO_YEARLY_USD: "<%= ENV["DODO_PRODUCT_PRO_YEARLY_USD"] %>"

    # Set number of processes dedicated to Solid Queue (default: 1)
    # JOB_CONCURRENCY: 3

    # Set number of cores available to the application on each server (default: 1).
    # WEB_CONCURRENCY: 2

    # Log everything from Rails
    # RAILS_LOG_LEVEL: debug

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole"
  # Create or reset the demo account once, without setting SEED_DEMO for every boot.
  seed: app exec --reuse "env SEED_DEMO=1 bin/rails db:seed"
  # One real Gemini call from the server, nothing saved: checks the key works.
  smoke: app exec --reuse "bin/rails path_aviator:smoke_generate"

# SQLite databases (app, cache, queue, cable) and Active Storage files live in
# /rails/storage. This named Docker volume keeps them across deploys and
# reboots; back up /var/lib/docker/volumes/path_aviator_storage off the server.
volumes:
  - "path_aviator_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder. Most VPSs are amd64; on an Apple Silicon Mac
# the build is emulated (slower) unless you use a remote builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server

# Use a different ssh user than root
# ssh:
#   user: app
