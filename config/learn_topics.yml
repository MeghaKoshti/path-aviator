    - { week: 12, title: "Mixed best-practice questions", type: practice, minutes: 300, url: "https://www.techinterviewhandbook.org/best-practice-questions/", description: "Problems from every topic, so you learn to spot the pattern without the topic label." }

- slug: react-for-backend-developers
