# Curated public study plans served at /learn/:slug.
# Each is a normal path (6 to 12 steps, the same shape the AI generator makes),
# so "Make this mine" can copy it into an account. Links point to official docs
# and long-lived free resources; checked_on is when every link was last opened
# and answered 200 (GitHub links were checked with git, as its pages block bots).
# Keep titles under 60 characters and descriptions under 160 for search results.

- slug: system-design-in-8-weeks
  checked_on: 2026-10-31
  title: System design in 8 weeks for backend developers
  description: An 8-week, 6-hours-a-week system design plan for backend developers with 1 to 4 years' experience. Free resources, in order, with practice.
  topic: System design for backend interviews
  level: intermediate
  hours_per_week: 6
  audience: Backend developers with 1 to 4 years' experience preparing for product-company interviews.
  summary: Learn the building blocks (caching, databases, queues, consistency), then practise designing real systems out loud, one week at a time.
  steps:
    - { week: 1, title: "Read the System Design Primer overview", type: course, minutes: 240, url: "https://github.com/donnemartin/system-design-primer", description: "Scalability basics, performance vs. scalability, latency vs. throughput, and how interviews are run." }
    - { week: 2, title: "Database indexes and how queries use them", type: docs, minutes: 180, url: "https://use-the-index-luke.com/", description: "Why some queries are slow and how indexes fix them. Most design trade-offs start here." }
    - { week: 2, title: "Replication and partitioning", type: docs, minutes: 120, url: "https://www.postgresql.org/docs/current/high-availability.html", description: "Primaries, replicas and failover, using PostgreSQL's own docs as the worked example." }
    - { week: 3, title: "Caching with Redis", type: docs, minutes: 180, url: "https://redis.io/docs/latest/develop/", description: "Cache-aside, expiry and eviction. Know what goes stale and how you'd notice." }
    - { week: 4, title: "Queues and event streams", type: docs, minutes: 180, url: "https://kafka.apache.org/documentation/#introduction", description: "Topics, partitions and consumer groups: the model behind most async designs." }
    - { week: 5, title: "Consistency and the CAP theorem", type: article, minutes: 120, url: "https://en.wikipedia.org/wiki/CAP_theorem", description: "What you give up during a network partition, and why most systems choose availability." }
    - { week: 5, title: "Lessons from the Amazon Builders' Library", type: article, minutes: 180, url: "https://aws.amazon.com/builders-library/", description: "Timeouts, retries with backoff, and avoiding fallback traps, from teams that run huge systems." }
    - { week: 6, title: "Reliability: SLOs and error budgets", type: course, minutes: 180, url: "https://sre.google/sre-book/service-level-objectives/", description: "How to talk about availability with numbers, from Google's SRE book." }
    - { week: 7, title: "Design a URL shortener and a rate limiter", type: practice, minutes: 300, url: "https://github.com/donnemartin/system-design-primer#system-design-interview-questions-with-solutions", description: "Work through the solved examples on paper first, then compare with the primer's answers." }
    - { week: 8, title: "Run timed mock design interviews", type: practice, minutes: 360, url: "https://www.techinterviewhandbook.org/system-design/", description: "Three 45-minute mocks: requirements, estimates, high-level design, then deep dives." }

- slug: rails-developer-roadmap-2026
  checked_on: 2026-10-31
  title: Ruby on Rails developer roadmap 2026
  description: A 10-week Rails 8 roadmap from Ruby basics to a deployed Hotwire app, using the official guides. 6 hours a week, built for job switchers.
  topic: Ruby on Rails 8
  level: beginner
  hours_per_week: 6
  audience: Developers moving to Rails from another stack, or freshers aiming at Rails product companies.
  summary: Ruby first, then the Rails guides in the order you'll use them, Hotwire for the front end, tests, background jobs, security and a real deploy.
  steps:
    - { week: 1, title: "Ruby in 20 minutes", type: docs, minutes: 60, url: "https://www.ruby-lang.org/en/documentation/quickstart/", description: "Syntax, blocks and classes before touching Rails." }
    - { week: 1, title: "Practise Ruby on Exercism", type: practice, minutes: 240, url: "https://exercism.org/tracks/ruby", description: "Ten small exercises with mentor feedback. Enumerable will come up in every interview." }
    - { week: 2, title: "Getting Started with Rails", type: docs, minutes: 300, url: "https://guides.rubyonrails.org/getting_started.html", description: "Build the official store app to see MVC, routing and generators in action." }
    - { week: 3, title: "Active Record basics and migrations", type: docs, minutes: 180, url: "https://guides.rubyonrails.org/active_record_basics.html", description: "Models, migrations, validations and callbacks." }
    - { week: 4, title: "Associations", type: docs, minutes: 180, url: "https://guides.rubyonrails.org/association_basics.html", description: "has_many, belongs_to, has_many :through, and how to avoid N+1 queries." }
    - { week: 5, title: "Hotwire: Turbo Frames and Streams", type: docs, minutes: 240, url: "https://turbo.hotwired.dev/handbook/introduction", description: "Fast, app-like pages without a JavaScript framework." }
    - { week: 6, title: "Testing Rails applications", type: docs, minutes: 240, url: "https://guides.rubyonrails.org/testing.html", description: "Model, controller and system tests with Minitest." }
    - { week: 7, title: "Background jobs with Active Job", type: docs, minutes: 120, url: "https://guides.rubyonrails.org/active_job_basics.html", description: "Move slow work out of requests. Rails 8 runs jobs on Solid Queue." }
    - { week: 7, title: "Securing Rails applications", type: docs, minutes: 120, url: "https://guides.rubyonrails.org/security.html", description: "CSRF, SQL injection, XSS and mass assignment: what Rails covers and what you must." }
    - { week: 8, title: "Build your own CRUD side project", type: practice, minutes: 600, url: "https://guides.rubyonrails.org/command_line.html", description: "Something you'd use yourself, with auth, one association and a Turbo Stream. This is your interview demo." }
    - { week: 10, title: "Deploy it with Kamal", type: docs, minutes: 180, url: "https://kamal-deploy.org/docs/installation/", description: "Ship the app to a small VPS and put the live link on your CV." }

- slug: dsa-in-12-weeks-while-working
