- slug: sql-for-developers
  checked_on: 2026-10-31
  title: SQL for developers in 4 weeks
  description: A 4-week SQL plan for developers who mostly use an ORM. Joins, window functions, indexes, EXPLAIN and transactions, with hands-on practice.
  topic: SQL for developers
  level: beginner
  hours_per_week: 4
  audience: Developers who rely on an ORM and freeze when an interviewer asks for raw SQL or a slow query fix.
  summary: Interactive basics, then the PostgreSQL tutorial for joins and window functions, and finally indexes, query plans and transactions.
  steps:
    - { week: 1, title: "SQLBolt interactive lessons", type: practice, minutes: 180, url: "https://sqlbolt.com/", description: "SELECT, filtering, joins and aggregates in the browser." }
    - { week: 1, title: "The PostgreSQL tutorial", type: docs, minutes: 90, url: "https://www.postgresql.org/docs/current/tutorial.html", description: "Create tables and query them in a real database." }
    - { week: 2, title: "Joins between tables", type: docs, minutes: 60, url: "https://www.postgresql.org/docs/current/tutorial-join.html", description: "Inner, outer and self joins." }
    - { week: 2, title: "Mode's SQL tutorial", type: course, minutes: 180, url: "https://mode.com/sql-tutorial/", description: "Intermediate and advanced lessons on realistic data." }
    - { week: 3, title: "Window functions", type: docs, minutes: 60, url: "https://www.postgresql.org/docs/current/tutorial-window.html", description: "Running totals and rankings, a favourite interview question." }
    - { week: 3, title: "Use the Index, Luke", type: article, minutes: 180, url: "https://use-the-index-luke.com/", description: "How indexes work and why your query isn't using one." }
    - { week: 4, title: "Read a query plan with EXPLAIN", type: docs, minutes: 90, url: "https://www.postgresql.org/docs/current/using-explain.html", description: "Find the slow part of a query instead of guessing." }
    - { week: 4, title: "Transaction isolation", type: docs, minutes: 60, url: "https://www.postgresql.org/docs/current/transaction-iso.html", description: "Read committed vs. repeatable read, and the bugs each allows." }
    - { week: 4, title: "PostgreSQL Exercises", type: practice, minutes: 180, url: "https://pgexercises.com/", description: "Graded problems on one schema, from simple to recursive queries." }

