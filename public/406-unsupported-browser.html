<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <title>Browser not supported (406) | Path Aviator</title>
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <style>
      /* Static page: served without the asset pipeline, so styles are inline. Colours match the app's design tokens. */
      *, *::before, *::after { box-sizing: border-box; }
      * { margin: 0; }
      html { font-size: 16px; -webkit-text-size-adjust: 100%; }
      body {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 2rem 1rem;
        background-color: #f5f6fa;
        background-image: linear-gradient(#dde0eb 1px, transparent 1px), linear-gradient(90deg, #dde0eb 1px, transparent 1px);
        background-size: 40px 40px;
        color: #15173a;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        line-height: 1.6;
        -webkit-font-smoothing: antialiased;
      }
      main {
        width: 100%;
        max-width: 32rem;
        padding: 2.5rem 2rem;
        border: 1px solid #dde0eb;
        border-radius: 1rem;
        background: #ffffff;
        box-shadow: 0 1px 2px rgb(21 23 58 / 0.05), 0 12px 32px -16px rgb(21 23 58 / 0.22);
      }
      .brand { display: inline-flex; align-items: center; gap: 0.625rem; color: #15173a; font-weight: 700; text-decoration: none; }
      .route { display: block; width: 100%; height: auto; margin: 2rem 0 1.5rem; }
      .code { color: #b4277a; font-weight: 700; font-size: 0.9375rem; letter-spacing: 0.02em; }
      h1 { margin-top: 0.25rem; font-size: clamp(1.625rem, 5vw, 2rem); font-stretch: 125%; line-height: 1.15; letter-spacing: -0.02em; }
      p { margin-top: 0.75rem; color: #474b6b; }
      .button {
        display: inline-block;
        margin-top: 1.75rem;
        padding: 0.75rem 1.25rem;
        border-radius: 0.625rem;
        background: #4f3bcb;
        color: #ffffff;
        font-weight: 600;
        text-decoration: none;
      }
      .button:hover { background: #3f2daa; }
      a:focus-visible { outline: 3px solid #6652dd; outline-offset: 2px; border-radius: 0.375rem; }
    </style>
  </head>
  <body>
    <main>
      <a class="brand" href="/">
        <svg width="32" height="32" viewBox="0 0 32 32" aria-hidden="true">
          <rect width="32" height="32" rx="9" fill="#3f2daa"/>
          <path d="M8.5 23.5c4.5 0 5-6.5 9-7.5s4.5-3.5 5.5-6" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-dasharray="3 2.5"/>
          <circle cx="8.5" cy="23.5" r="2.6" fill="#b4277a"/>
          <path d="M25.5 6.5 24.6 13l-2-2.4-3 .6z" fill="#ffffff"/>
        </svg>
        Path Aviator
      </a>

      <!-- A route that sets off and then breaks: the page couldn't be reached. -->
      <svg class="route" viewBox="0 0 440 90" fill="none" aria-hidden="true">
        <path d="M12 70 C 60 70, 80 30, 140 34 S 210 64, 250 52" stroke="#b4277a" stroke-width="3" stroke-linecap="round"/>
        <path d="M286 40 C 330 26, 370 40, 428 18" stroke="#b4277a" stroke-opacity="0.45" stroke-width="2" stroke-dasharray="5 7" stroke-linecap="round"/>
        <circle cx="12" cy="70" r="6" fill="#b4277a"/>
        <path d="M262 38 l14 14 M276 38 l-14 14" stroke="#15173a" stroke-width="2.5" stroke-linecap="round"/>
        <path d="M428 9 l8 14 h-16 z" fill="#3f2daa" fill-opacity="0.45"/>
      </svg>

      <p class="code">Error 406: Browser not supported</p>
      <h1>Your browser isn’t supported</h1>
      <p>Path Aviator needs a recent version of Chrome, Edge, Firefox or Safari. Update your browser, then try again.</p>
      <a class="button" href="/">Go to the home page</a>
    </main>
  </body>
</html>
